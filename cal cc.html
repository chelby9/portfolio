<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatrice iPhone iOS</title>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* Châssis de l'iPhone */
        .iphone-calc {
            background-color: #000000;
            width: 330px;
            height: 600px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            box-sizing: border-box;
        }

        /* Écran d'affichage iOS style */
        .screen {
            color: #ffffff;
            text-align: right;
            padding: 0 12px;
            margin-bottom: 16px;
        }

        .formula {
            font-size: 1.1rem;
            color: #666666;
            min-height: 1.4rem;
            margin-bottom: 4px;
        }

        .current-value {
            font-size: 4.8rem;
            font-weight: 300;
            letter-spacing: -2px;
            line-height: 1;
        }

        /* Grille des boutons ronds Apple */
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        .btn {
            border: none;
            border-radius: 50%;
            height: 70px;
            width: 70px;
            font-size: 1.9rem;
            font-weight: 400;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: filter 0.1s ease;
        }

        /* Comportement au clic : l'iPhone éclaircit les boutons */
        .btn:active {
            filter: brightness(1.4);
        }

        /* 1. Boutons gris clair (Fonctions du haut) */
        .btn-top {
            background-color: #a5a5a5;
            color: #000000;
            font-size: 1.6rem;
        }

        /* 2. Boutons gris foncé (Chiffres) */
        .btn-num {
            background-color: #333333;
            color: #ffffff;
            font-weight: 300;
        }

        /* 3. Boutons Orange (Opérateurs à droite) */
        .btn-op {
            background-color: #ff9f0a;
            color: #ffffff;
            font-size: 2.3rem;
            font-weight: 400;
        }

        /* Bouton Zéro allongé spécifique à iOS */
        .btn-zero {
            grid-column: span 2;
            width: auto;
            border-radius: 40px;
            padding-left: 26px;
            justify-content: flex-start;
        }
    </style>
</head>
<body>

    <div class="iphone-calc">
        <div class="screen">
            <div class="formula" id="formulaDisplay"></div>
            <div class="current-value" id="screenDisplay">0</div>
        </div>

        <div class="keypad">
            <button class="btn btn-top" data-action="clear">AC</button>
            <button class="btn btn-top" data-action="toggle-sign">+/-</button>
            <button class="btn btn-top" data-action="percent">%</button>
            <button class="btn btn-op" data-op="/">÷</button>

            <button class="btn btn-num">7</button>
            <button class="btn btn-num">8</button>
            <button class="btn btn-num">9</button>
            <button class="btn btn-op" data-op="*">×</button>

            <button class="btn btn-num">4</button>
            <button class="btn btn-num">5</button>
            <button class="btn btn-num">6</button>
            <button class="btn btn-op" data-op="-">−</button>

            <button class="btn btn-num">1</button>
            <button class="btn btn-num">2</button>
            <button class="btn btn-num">3</button>
            <button class="btn btn-op" data-op="+">+</button>

            <button class="btn btn-num btn-zero">0</button>
            <button class="btn btn-num" data-action="decimal">,</button>
            <button class="btn btn-op" id="equalsBtn">=</button>
        </div>
    </div>

    <script>
        const screenDisplay = document.getElementById('screenDisplay');
        const formulaDisplay = document.getElementById('formulaDisplay');
        const keypad = document.querySelector('.keypad');

        let currentInput = '0';
        let previousInput = '';
        let operation = null;
        let shouldResetScreen = false;

        keypad.addEventListener('click', (e) => {
            if (!e.target.matches('button')) return;

            const button = e.target;
            const value = button.innerText;
            const action = button.dataset.action;
            const op = button.dataset.op;

            if (!action && !op) {
                appendNumber(value);
            } else if (op) {
                handleOperator(op, value);
            } else if (action) {
                handleAction(action);
            }
            
            if (button.id === 'equalsBtn') {
                calculate();
            }

            updateScreen();
        });

        function appendNumber(number) {
            if (currentInput === '0' || shouldResetScreen) {
                currentInput = number;
                shouldResetScreen = false;
            } else {
                if (currentInput.replace('.', '').length > 8) return; 
                currentInput += number;
            }
        }

        function handleOperator(nextOp, opSymbol) {
            if (operation && !shouldResetScreen) {
                calculate();
            }
            previousInput = currentInput;
            operation = nextOp;
            formulaDisplay.textContent = `${previousInput} ${opSymbol}`;
            shouldResetScreen = true;
        }

        function handleAction(action) {
            switch (action) {
                case 'clear':
                    currentInput = '0';
                    previousInput = '';
                    operation = null;
                    formulaDisplay.textContent = '';
                    break;
                case 'toggle-sign':
                    currentInput = (parseFloat(currentInput) * -1).toString();
                    break;
                case 'percent':
                    currentInput = (parseFloat(currentInput) / 100).toString();
                    break;
                case 'decimal':
                    if (!currentInput.includes('.')) {
                        currentInput += '.';
                    }
                    break;
            }
        }

        function calculate() {
            if (!operation || shouldResetScreen) return;

            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);
            let result = 0;

            switch (operation) {
                case '+': result = prev + current; break;
                case '-': result = prev - current; break;
                case '*': result = prev * current; break;
                case '/': 
                    result = current === 0 ? 'Erreur' : prev / current;
                    break;
            }

            formulaDisplay.textContent = '';
            
            if (typeof result === 'number') {
                // Évite les bugs de virgules flottantes infinis (ex: 0.1 + 0.2)
                result = parseFloat(result.toFixed(7));
                currentInput = result.toString();
            } else {
                currentInput = result;
            }
            
            operation = null;
            shouldResetScreen = true;
        }

        function updateScreen() {
            // Remplacement des points par des virgules pour le public francophone
            screenDisplay.textContent = currentInput.replace('.', ',');
            
            // Réduction de la police si le chiffre devient très grand (effet iOS)
            const length = currentInput.length;
            if (length > 7) {
                screenDisplay.style.fontSize = '2.6rem';
            } else if (length > 5) {
                screenDisplay.style.fontSize = '3.6rem';
            } else {
                screenDisplay.style.fontSize = '4.8rem';
            }
        }
    </script>
</body>
</html>
